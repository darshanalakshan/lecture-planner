name: Daily lecture plan

on:
  schedule:
    - cron: "0 19 * * *"   # 19:00 UTC = 20:00 Stockholm in winter, 21:00 in summer
  workflow_dispatch:        # enables the "Run workflow" button

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python plan_mailer.py
        env:
          ICS_URL: ${{ secrets.ICS_URL }}
          VT_KEY: ${{ secrets.VT_KEY }}
          VT_SECRET: ${{ secrets.VT_SECRET }}
          RESROBOT_KEY: ${{ secrets.RESROBOT_KEY }}
          ORIGIN_ID: ${{ secrets.ORIGIN_ID }}
          DEST_ID: ${{ secrets.DEST_ID }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          ALARM_PAGE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/alarm.html
